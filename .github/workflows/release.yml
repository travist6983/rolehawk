name: Release

# Builds the release ZIP and smoke-tests the real install scripts on every OS: install from a
# local copy of the release files, start the app, then `offerbound update` to a build labeled
# one patch version higher. A v* tag also publishes the files as a GitHub release (the install
# lines download .../releases/latest/download/offerbound.zip).

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - scripts/**
      - backend/src/offerbound/install/**
      - backend/src/offerbound/cli.py
      - backend/pyproject.toml
      - backend/uv.lock
      - .github/workflows/release.yml
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the install script
        run: shellcheck scripts/install.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: astral-sh/setup-uv@v6
      - name: Build the release files
        run: |
          tag=()
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag=(--tag "$GITHUB_REF_NAME"); fi
          uv run --no-project --python 3.12 python scripts/build_release.py --out dist/release "${tag[@]}"
          next=$(python3 -c "import json; v = json.load(open('dist/release/release.json'))['version'].split('.'); v[2] = str(int(v[2]) + 1); print('.'.join(v))")
          uv run --no-project --python 3.12 python scripts/build_release.py --out dist/next --version "$next"
          ls -l dist/release dist/next
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/
          if-no-files-found: error

  smoke:
    name: install (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      OFFERBOUND_NO_START: "1"
      OFFERBOUND_RELEASE_URL: http://127.0.0.1:8799
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist

      - name: Install, start, and update (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8799 --bind 127.0.0.1 --directory dist/release >/dev/null 2>&1 &
          python3 -m http.server 8800 --bind 127.0.0.1 --directory dist/next >/dev/null 2>&1 &
          sleep 1

          bash < scripts/install.sh   # as `curl ... | bash` runs it
          export PATH="$HOME/.local/bin:$PATH"
          offerbound --version

          offerbound doctor --json > doctor.json || true
          python3 .github/scripts/check_doctor.py doctor.json

          offerbound start --no-browser &
          app=$!
          for _ in $(seq 1 60); do curl -fs http://127.0.0.1:8765/api/health && break; sleep 1; done
          echo
          curl -fs http://127.0.0.1:8765/ | grep -q 'id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/api/profile)" = 401
          kill "$app"
          wait "$app" || true

          OFFERBOUND_RELEASE_URL=http://127.0.0.1:8800 offerbound update
          next=$(python3 -c "import json; print(json.load(open('dist/next/release.json'))['version'])")
          test "$(cat "$HOME/.offerbound/current")" = "$next"
          offerbound doctor > doctor.txt || true   # exits 1 on Linux CI: no keychain service
          grep "install: release $next" doctor.txt
          OFFERBOUND_RELEASE_URL=http://127.0.0.1:8800 offerbound update | grep "newest release"
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude" offerbound install-skills
          test -f "$RUNNER_TEMP/claude/skills/offerbound-setup/SKILL.md"

      - name: Install, start, and update (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($pair in @(@("8799", "dist/release"), @("8800", "dist/next"))) {
            Start-Process python -WindowStyle Hidden -ArgumentList "-m", "http.server", $pair[0], "--bind", "127.0.0.1", "--directory", $pair[1]
          }
          Start-Sleep -Seconds 2

          Get-Content scripts/install.ps1 -Raw | Invoke-Expression   # as `irm ... | iex` runs it
          $bin = Join-Path $env:USERPROFILE ".local\bin"
          $env:Path = "$bin;$env:Path"
          offerbound --version
          if ($LASTEXITCODE -ne 0) { throw "the offerbound command doesn't run" }

          offerbound doctor --json | Out-File -Encoding utf8 doctor.json
          python .github/scripts/check_doctor.py doctor.json
          if ($LASTEXITCODE -ne 0) { throw "doctor checks failed" }

          $app = Start-Process (Join-Path $bin "offerbound.cmd") -ArgumentList "start", "--no-browser" -WindowStyle Hidden -PassThru
          $healthy = $false
          foreach ($i in 1..60) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/api/health | Out-Null; $healthy = $true; break } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $healthy) { throw "the app didn't start" }
          if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/).Content -notmatch 'id="root"') { throw "no dashboard" }
          try {
            Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/api/profile | Out-Null
            throw "the API answered without a session token"
          } catch [System.Net.WebException] {
            if ([int]$_.Exception.Response.StatusCode -ne 401) { throw }
          }
          taskkill /T /F /PID $app.Id | Out-Null

          $env:OFFERBOUND_RELEASE_URL = "http://127.0.0.1:8800"
          offerbound update
          if ($LASTEXITCODE -ne 0) { throw "update failed" }
          $next = (Get-Content dist/next/release.json -Raw | ConvertFrom-Json).version
          $current = (Get-Content (Join-Path $env:USERPROFILE ".offerbound\current") -Raw).Trim()
          if ($current -ne $next) { throw "expected $next, got $current" }
          $report = offerbound doctor | Out-String
          if ($report -notmatch "install: release $next") { throw "doctor doesn't see the update" }
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "claude"
          offerbound install-skills
          if (-not (Test-Path (Join-Path $env:CLAUDE_CONFIG_DIR "skills\offerbound-setup\SKILL.md"))) { throw "skills weren't installed" }
          Write-Host "Install, start, and update all worked."

  publish:
    name: publish release
    if: github.ref_type == 'tag'
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/release/offerbound.zip dist/release/offerbound.zip.sha256 dist/release/release.json
          --repo "$GITHUB_REPOSITORY" --title "Offerbound AI $GITHUB_REF_NAME" --generate-notes
